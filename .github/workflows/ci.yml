name: FASTRA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_api.txt
        pip install pytest hypothesis mypy bandit httpx psutil

    - name: Audit Fase 0-4
      run: python audit_fase0_4.py

    - name: Compliance Tests
      run: python -m pytest tests/test_compliance_aces400.py -v

    - name: API Stress Tests
      run: python -m pytest tests/test_api_stress.py -v

    - name: Type Checking (mypy)
      run: python -m mypy fastra_core --ignore-missing-imports

    - name: Security Scan (bandit)
      run: python -m bandit -r fastra_core api_secure.py -q

    - name: Benchmark (CI-safe)
      run: python dev_tools/benchmark_pipeline.py --ci
