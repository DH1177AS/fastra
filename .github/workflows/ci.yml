name: FASTRA CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fastra_user
          POSTGRES_PASSWORD: fastra_password
          POSTGRES_DB: fastra_dt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastra_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements_api.txt
          pip install pytest hypothesis mypy bandit sqlalchemy psycopg2-binary pyjwt bcrypt python-dotenv python-multipart fastapi uvicorn
      - name: Run mypy
        run: python -m mypy fastra_core --ignore-missing-imports
      - name: Run bandit
        run: python -m bandit -r fastra_core api_secure.py api_digital_twin.py api_digital_twin_secure.py api_ai.py auth_secure.py -q
      - name: Run pytest
        run: python -m pytest tests -q
      - name: Run ACTS Runner
        run: |
          python acts_runner.py
          python generate_compliance_report.py
      - name: Audit
        run: python audit_fase0_4.py