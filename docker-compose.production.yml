version: "3.9"

# ------------------------------------------------------------------------------
# FASTRA Military-Grade Docker Compose
# Isolasi jaringan internal, minimal privileges, read-only filesystems,
# resource limits, health checks, logging rotation, dan security hardening.
# ------------------------------------------------------------------------------

networks:
  fastra_isolated_network:
    driver: bridge
    internal: true          # Blokir akses ke internet, hanya komunikasi antar container
    enable_ipv6: false
    labels:
      com.fastra.security.level: "military_grade"
      com.fastra.network.zone: "isolated_backend"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "postgres:postgres"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - fastra_isolated_network
    environment:
      POSTGRES_USER: ${FASTRA_DB_USER}
      POSTGRES_PASSWORD: ${FASTRA_DB_PASSWORD}
      POSTGRES_DB: ${FASTRA_DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tidak ada port mapping ke host → hanya bisa diakses dari dalam jaringan
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    init: true                     # Tangani zombie processes (tini)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - fastra_isolated_network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Langsung interpolasi dari .env (tanpa double dollar)
      FASTRA_DATABASE_URL: postgresql+psycopg2://${FASTRA_DB_USER}:${FASTRA_DB_PASSWORD}@db:5432/${FASTRA_DB_NAME}
      FASTRA_DT_SECRET_KEY: ${FASTRA_DT_SECRET_KEY}
      FASTRA_DT_API_KEY: ${FASTRA_DT_API_KEY}
      FASTRA_ENV: "production"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/run:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "8000:8000"                 # Ekspos API ke host/reverse proxy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    command: [
      "uvicorn", "api_digital_twin_secure:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--workers", "4",
      "--proxy-headers",
      "--forwarded-allow-ips", "127.0.0.1",   # Batasi hanya dari reverse proxy lokal
    ]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  postgres_data:
    driver: local
    labels:
      com.fastra.storage.type: "encrypted_persistent_data"