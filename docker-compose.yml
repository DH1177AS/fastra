version: "3.9"

# ------------------------------------------------------------------------------
# FASTRA Redis - Military-Grade Hardened Configuration
# - No host port exposure (only internal network)
# - Read-only root filesystem with dedicated writable volume for persistence
# - Minimal capabilities, no-new-privileges, init process
# - Password via environment variable, healthcheck without exposing credentials
# - Log rotation to prevent disk exhaustion
# ------------------------------------------------------------------------------

networks:
  fastra_isolated_network:
    external: true
    name: fastra_isolated_network

services:
  redis:
    image: redis:7-alpine
    container_name: fastra-redis
    restart: unless-stopped
    read_only: true               # Root filesystem immutable
    user: "redis:redis"           # Non-root user
    init: true                    # Handle zombie processes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                       # Drop all capabilities; Redis doesn't need any
    # No cap_add needed for Redis when using non-root user and proper volume permissions
    networks:
      - fastra_isolated_network   # Attach to existing external network
    environment:
      REDIS_PASSWORD: ${FASTRA_REDIS_PASSWORD}
      REDISCLI_AUTH: ${FASTRA_REDIS_PASSWORD}   # Allows redis-cli to authenticate without -a
    volumes:
      - redis_data:/data          # Persistent data volume (writable)
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m   # Temporary writable area for Redis
    # No ports exposed to host - Redis is only accessible via internal Docker network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      redis-server
      --requirepass "$REDIS_PASSWORD"
      --maxmemory 750mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --protected-mode yes
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command SHUTDOWN ""
      --save 60 1000             # Explicit snapshot policy for persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]       # Uses REDISCLI_AUTH env var
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  redis_data:
    driver: local
    labels:
      com.fastra.storage.type: "cache_persistent_data"