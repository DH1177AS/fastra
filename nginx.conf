# =========================================================================
# FASTRA REVERSE PROXY HARDENING - MILITARY GRADE SECURITY CONFIGURATION
# =========================================================================

# Limit request rate untuk mitigasi brute force & DoS
limit_req_zone $binary_remote_addr zone=fastra_rate_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fastra_conn_limit:10m;

# Blok Server Utama: Enkripsi TLS Kuat dengan Proteksi Headers Berlapis
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fastra.example.com;

    # =====================================================================
    # TLS & CERTIFICATE MANAGEMENT
    # =====================================================================
    ssl_certificate     /etc/nginx/certs/fastra.crt;
    ssl_certificate_key /etc/nginx/certs/fastra.key;

    # Hanya izinkan TLS 1.2 & 1.3; matikan versi lama
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Cipher modern dengan Perfect Forward Secrecy (PFS)
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Kurangi waktu sesi & matikan session tickets (anti session resumption abuse)
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling untuk verifikasi sertifikat yang lebih cepat & aman
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # File Diffie-Hellman parameter (wajib >=2048-bit)
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # Sembunyikan versi Nginx (mencegah fingerprinting)
    server_tokens off;

    # =====================================================================
    # SECURITY HEADERS
    # =====================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS: wajib HTTPS selama 2 tahun, termasuk subdomain, preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # =====================================================================
    # BODY & BUFFER HARDENING
    # =====================================================================
    client_max_body_size 5M;             # Batasi upload (lebih ketat dari 10M)
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # =====================================================================
    # TIMEOUT & CONNECTION HARDENING (anti Slowloris)
    # =====================================================================
    keepalive_timeout 30s;
    keepalive_requests 100;
    send_timeout 30s;
    client_body_timeout 12s;
    client_header_timeout 12s;

    # =====================================================================
    # RATE LIMITING & CONNECTION LIMITING
    # =====================================================================
    limit_req zone=fastra_rate_limit burst=20 nodelay;
    limit_conn fastra_conn_limit 10;

    # =====================================================================
    # REVERSE PROXY LAYER
    # =====================================================================
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeout proxy agresif
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Batasi metode HTTP yang tidak diperlukan
        limit_except GET POST HEAD {
            deny all;
        }

        # Blokir akses ke path sensitif
        location ~* ^/(?:\.git|\.env|config\.php|composer\.json|Dockerfile) {
            deny all;
            return 404;
        }
    }

    # =====================================================================
    # ERROR HANDLING - JSON RESPONSE UNTUK MENYEMBUNYIKAN INTERNALS
    # =====================================================================
    error_page 400 401 403 404 405 413 429 500 502 503 504 /error.json;
    location = /error.json {
        internal;
        default_type application/json;
        add_header Content-Type application/json;
        return 400 '{"status":"error","message":"bad_request_or_malicious_activity_intercepted"}';
    }
}

# =====================================================================
# HTTP to HTTPS REDIRECT (dengan HSTS preload)
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name fastra.example.com;

    server_tokens off;

    # Hanya izinkan metode GET/HEAD untuk redirect
    limit_except GET HEAD {
        deny all;
    }

    # Redirect permanen ke HTTPS
    return 301 https://$host$request_uri;
}